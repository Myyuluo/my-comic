name: my_comic
resolution: workspace
description: MyComic - a Windows desktop manga reader (Mihon-compatible).
publish_to: 'none'
version: 1.0.0+1355
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: "^3.47.0"

dependencies:
  archive: ^3.6.1
  cached_network_image: ^3.4.1
  collection:
  # Flutter 3.47 起 Material / Cupertino 拆成独立 pub 包；本仓已迁移
  # （tool/migrate_design_widgets.sh）。lib/ 下禁止再 import
  # package:flutter/material.dart / cupertino.dart（守卫
  # test/build/design_widgets_import_guard_test.dart）。
  cupertino_ui: ^1.1.3
  # cupertino_ui only declares CupertinoIcons' fontPackage; the app must depend
  # on cupertino_icons so the TTF is bundled. Without it Cupertino mode renders
  # every CupertinoIcons glyph as tofu.
  cupertino_icons: ^1.0.8
  material_ui: ^1.7.0
  liquid_glass_widgets: ^1.8.1
  desktop_drop: ^0.5.0
  device_info_plus: ^9.0.0
  dio: ^5.1.1
  # 2.x 起依赖 material_ui：其 ColorScheme 与本仓迁移后的 ColorScheme 同一类型。
  dynamic_color: ^2.1.0
  # 分段条溢出滚动的渐隐边缘（vendored，见 dependency_overrides）。
  fading_edge_scrollview: ^3.0.0
  file_picker: ^8.0.0
  # Windows IFileOpenDialog-backed file picker: honors initialDirectory via
  # SetFolder, unlike file_picker's legacy GetOpenFileNameW path.
  file_selector: ^1.1.0
  # Cross-platform game controllers (GameInput / GameController / evdev).
  # BUILD PREREQ: the Windows backend (gamepads_windows) #includes <GameInput.h>,
  # which ships only in Windows SDK >= 10.0.26100 — every Windows build
  # machine/CI must have that SDK installed. (Android is overridden to a no-op
  # below; see dependency_overrides.)
  gamepads: ^0.1.10+2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  my_comic_core:
    path: ../packages/my_comic_core
  my_comic_cli:
    path: ../packages/my_comic_cli
  my_comic_engine:
    path: ../packages/my_comic_engine
  my_comic_platform:
    path: ../packages/my_comic_platform
  flutter_cache_manager: ^3.3.0
  flutter_colorpicker: ^1.1.0
  flutter_markdown: ^0.6.18
  flutter_inappwebview: ^6.1.5
  # v101 统一更新提醒的系统通知后端。选 20.x 而不是 22.x：22 起要求
  # `sdk: ^3.10.0`，会把本包的 SDK 下界从 3.8 顶上去；20.1.0 的
  # environment 与本仓一致，且 android/ios/macos/linux/windows 五端都有实现
  # （Windows 走 flutter_local_notifications_windows 的 WinRT toast）。
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^2.3.6
  fluttertoast: ^8.2.1
  drift: ">=2.33.0 <2.34.0"
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ">=3.4.0 <4.0.0"
  ffi: ^2.1.3
  gap: ^3.0.1
  http: ^1.2.0
  html: ^0.15.2
  image: ^4.3.0
  image_picker: ^0.8.7
  intl: ^0.20.2
  json_annotation: ^4.8.1
  json_serializable: ^6.6.1
  material_color_utilities: ^0.13.0
  marquee: ^2.2.3
  network_to_file_image: ^4.0.1
  package_info_plus: ^4.0.2
  path: ^1.8.2
  path_provider: ^2.0.13
  remove_emoji: ^0.0.7
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  # 测试根下的 SharedPreferences 隔离存储（startup/test_root_shared_preferences.dart）。
  shared_preferences_platform_interface: ^2.3.1
  slang: ^3.13.0
  slang_flutter: ^3.13.0
  stack_trace: ^1.11.1
  shelf: ^1.4.0
  crypto: ^3.0.0
  # BUG-2514：comico magazine_comic 根 URL 的 AES-CBC 解密。
  pointycastle: ^3.9.1
  meta: ^1.9.0
  transparent_image: ^2.0.1
  url_launcher: ^6.0.20
  xml: ^6.3.0
  wakelock_plus: ^1.1.4
  brotli: ^0.6.0
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1
dev_dependencies:
  # BUG-3003: native hot-restart regression waits for worker IsolateExit events.
  vm_service: ^15.1.0
  build_runner: ^2.3.3
  plugin_platform_interface: ^2.1.0
  # BUG-2499: local_update_notifier_test 直接驱动 Windows toast 的 image XML
  # 序列化，守卫 ci/patches/hosted/flutter_local_notifications_windows-2.0.1
  # 的补丁真的打上了（file 路径不得百分号编码）。flutter_local_notifications
  # 的传递依赖，声明只为测试 import。
  flutter_local_notifications_windows: ^2.0.1
  drift_dev: ^2.23.0
  dependency_validator: ^3.0.0
  flutter_lints: ^2.0.1
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # my-comic：TMDB（视频）、Anki、浏览器查词扩展、网页视频播放器素材已移除。
    - assets/gamepad/xbox/
    - assets/gamepad/playstation/
    - assets/gamepad/switch/
    - assets/fonts/
    - assets/licenses/
    - assets/meta/
    # my-comic：词典弹窗（popup）与变形表（transforms）素材已移除。

  # M3E 语义图标（lib/src/utils/my_comic_icons.dart）：Material Symbols Rounded 可变字体
  # 的子集，由 tool/icons/gen_my_comic_symbols.py 生成。线框 / 实心各一个字族——选中态在
  # 只能传 IconData 的 API 里也能表达。release 构建的图标树摇只留用到的码位。
  # 刻意不放进上面的 assets/fonts/（那个目录整体登记为普通 asset，供阅读器 WebView
  # 按 URL 取用，不会被树摇）。
  fonts:
    - family: MyComicSymbols
      fonts:
        - asset: assets/icon_fonts/MyComicSymbolsRounded.ttf
    - family: MyComicSymbolsFilled
      fonts:
        - asset: assets/icon_fonts/MyComicSymbolsRoundedFilled.ttf
