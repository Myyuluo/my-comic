name: fushi_engine
resolution: workspace
description: >-
  Fushi 纯 Dart 引擎（漫画域）：图源/发现页导入、下载库、本地图源、书架共享
  模型与基础设施。只被 Flutter app（fushi/）消费。
publish_to: none

# 本包 pubspec 不声明 flutter sdk：源码禁止 package:flutter / dart:ui / 任何
# method-channel 插件 import。依赖解析仍需要 Flutter SDK 作为 workspace 工具链；
# 运行时二进制不含 Flutter。
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  fushi_core:
    path: ../fushi_core
  archive: ^3.6.1
  crypto: ^3.0.0
  dio: ^5.1.1
  drift: ">=2.33.0 <2.34.0"
  ffi: ^2.1.3
  html: ^0.15.2
  http: ^1.2.0
  image: ^4.3.0
  meta: ^1.9.0
  path: ^1.8.2
  xml: ^6.3.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.24.0
