# FUSHI FORK of flutter_onnxruntime 1.8.3.
# All five plugin platforms (android/ios/linux/macos/windows) are upstream's.
# Delta vs upstream: the two Apple `Package.swift` manifests are deleted so
# Flutter builds this plugin through CocoaPods on both Apple platforms, and the
# Apple podspecs drop their deployment floors to the real `onnxruntime-objc`
# 1.23.0 minimums (iOS 15.1 / macOS 13.4) instead of upstream's conservative
# iOS 16.0 / macOS 14.0. Going through SwiftPM would import
# onnxruntime-swift-package-manager, whose manifest declares `.macOS(.v14)` and
# would drag the whole app to macOS 14. See PATCHES.md.
name: flutter_onnxruntime
description: "A lightweight plugin that provides native wrappers for running ONNX Runtime on multiple platforms"
version: 1.8.3
homepage: https://github.com/masicai/flutter_onnxruntime
repository: https://github.com/masicai/flutter_onnxruntime

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
   sdk: flutter
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used only by tests to fake getTemporaryDirectory() (already a transitive dep of path_provider).
  path_provider_platform_interface: ^2.1.2

flutter:
  plugin:
    platforms:
      android:
        package: com.masicai.flutteronnxruntime
        pluginClass: FlutterOnnxruntimePlugin
      ios:
        pluginClass: FlutterOnnxruntimePlugin
      linux:
        pluginClass: FlutterOnnxruntimePlugin
      macos:
        pluginClass: FlutterOnnxruntimePlugin
      web:
        pluginClass: FlutterOnnxruntimeWebPlugin
        fileName: web/flutter_onnxruntime_web_plugin.dart
      # my-comic (ticket 04): the Windows plugin registration is intentionally
      # removed. ONNX Runtime is only used by the on-device OCR/ASR paths,
      # which v1 does not ship (ADR-0002); dropping the platform declaration
      # keeps onnxruntime.dll / onnxruntime_providers_shared.dll out of the
      # Windows bundle while the Dart API remains compilable for the residual
      # (unreachable) OCR/ASR code. Android/Linux/Apple declarations are kept
      # untouched because this ticket only covers the Windows v1 product.

topics:
 - onnx
 - onnxruntime
 - machine-learning
 - deep-learning
 - model-inference
