name: fushi
resolution: workspace
description: A focused Japanese EPUB reader with popup dictionary and Anki integration.
publish_to: 'none'
version: 1.0.0+1355
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: "^3.47.0"

dependencies:
  archive: ^3.6.1
  basic_utils: ^5.7.0
  cached_network_image: ^3.4.1
  carousel_slider: ^4.2.1
  change_notifier_builder: ^1.1.2
  characters: ^1.3.0
  clipboard: ^0.1.3
  collection:
  cupertino_icons: ^1.0.8
  # Flutter 3.47 起 Material / Cupertino 拆成独立 pub 包；本仓已迁移
  # （tool/migrate_design_widgets.sh）。lib/ 下禁止再 import
  # package:flutter/material.dart / cupertino.dart（守卫
  # test/build/design_widgets_import_guard_test.dart）。
  cupertino_ui: ^1.1.3
  material_ui: ^1.7.0
  liquid_glass_widgets: ^1.8.1
  crop_image: ^1.0.4
  desktop_drop: ^0.5.0
  device_info_plus: ^9.0.0
  dio: ^5.1.1
  # 2.x 起依赖 material_ui：其 ColorScheme 与本仓迁移后的 ColorScheme 同一类型。
  dynamic_color: ^2.1.0
  external_app_launcher: ^4.0.3
  external_path: ^2.2.0
  # 分段条溢出滚动的渐隐边缘（vendored，见 dependency_overrides）。
  fading_edge_scrollview: ^3.0.0
  file_picker: ^8.0.0
  float_column: ^4.0.3
  # Cross-platform game controllers (GameInput / GameController / evdev).
  # BUILD PREREQ: the Windows backend (gamepads_windows) #includes <GameInput.h>,
  # which ships only in Windows SDK >= 10.0.26100 — every Windows build
  # machine/CI must have that SDK installed. (Android is overridden to a no-op
  # below; see dependency_overrides.)
  gamepads: ^0.1.10+2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fushi_core:
    path: ../packages/fushi_core
  fushi_cli:
    path: ../packages/fushi_cli
  fushi_engine:
    path: ../packages/fushi_engine
  fushi_platform:
    path: ../packages/fushi_platform
  google_sign_in: ^6.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  flutter_cache_manager: ^3.3.0
  flutter_colorpicker: ^1.1.0
  flutter_markdown: ^0.6.18
  flutter_exit_app: ^1.0.5
  flutter_html: ^3.0.0
  flutter_inappwebview: ^6.1.5
  # v101 统一更新提醒的系统通知后端。选 20.x 而不是 22.x：22 起要求
  # `sdk: ^3.10.0`，会把本包的 SDK 下界从 3.8 顶上去；20.1.0 的
  # environment 与本仓一致，且 android/ios/macos/linux/windows 五端都有实现
  # （Windows 走 flutter_local_notifications_windows 的 WinRT toast）。
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^2.3.6
  # WebRTC 游戏串流（Windows 主机；五端都可当接收端）。
  # 钉精确版本，不用 caret：WGC 客户区采集的入口只在
  # ci/patches/hosted/flutter_webrtc-1.6.2+hotfix.3/ 那份补丁里，而补丁目录按
  # 精确版本命名、apply-patches.sh 对目标缺失只打一行 WARNING 不判红。约束一旦
  # 漂到 1.6.3 就是「编译照过、运行时零帧」。升版本时同步改补丁目录名。
  flutter_webrtc: 1.6.2+hotfix.3
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^8.2.1
  drift: ">=2.33.0 <2.34.0"
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ">=3.4.0 <4.0.0"
  ffi: ^2.1.3
  gap: ^3.0.1
  http: ^1.2.0
  html: ^0.15.2
  html_unescape: ^2.0.0
  youtube_explode_dart: ^2.3.6
  image: ^4.3.0
  image_picker: ^0.8.7
  intl: ^0.20.2
  json_annotation: ^4.8.1
  json_serializable: ^6.6.1
  macos_ui: ^2.2.2
  material_color_utilities: ^0.13.0
  marquee: ^2.2.3
  multi_value_listenable_builder: ^0.0.2
  network_to_file_image: ^4.0.1
  package_info_plus: ^4.0.2
  path: ^1.8.2
  path_provider: ^2.0.13
  progress_indicators: ^1.0.0
  remove_emoji: ^0.0.7
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  # 测试根下的 SharedPreferences 隔离存储（startup/test_root_shared_preferences.dart）。
  shared_preferences_platform_interface: ^2.3.1
  slang: ^3.13.0
  slang_flutter: ^3.13.0
  sliver_tools: ^0.2.12
  stack_trace: ^1.11.1
  shelf: ^1.4.0
  ftpconnect: ^2.0.10
  dartssh2: ^2.9.0
  crypto: ^3.0.0
  # BUG-2514：comico magazine_comic 根 URL 的 AES-CBC 解密（basic_utils 已带入，这里只是显式声明）。
  pointycastle: ^3.9.1
  meta: ^1.9.0
  transparent_image: ^2.0.1
  url_launcher: ^6.0.20
  visibility_detector: ^0.4.0+2
  xml: ^6.3.0
  wakelock_plus: ^1.1.4
  # 反馈有新回复时的后台检查：Android 走 WorkManager 周期任务（15 分钟最小周期、
  # 联网约束），iOS 走 BGTaskScheduler app refresh（系统决定时机）。只在主 app
  # 入口注册，后台 isolate 只读本机工单回执、问一次进度、发本地通知（见
  # lib/src/feedback/feedback_reply_background.dart）。桌面不用它（运行中定时检查）。
  workmanager: ^0.10.10
  brotli: ^0.6.0
  bonsoir: ^7.1.1
  # 移动端 ffmpeg：用「自编」的 ffmpeg-kit（arthenica 源码 + NDK r25 重编最小变体），
  # 替代崩溃的第三方预编译 ffmpeg-kit 变体（其 libffmpegkit_abidetect.so 在
  # Android 16/API 36 上 JNI_OnLoad 返回非法版本，启动即崩，BUG-122）。vendored 包见
  # dependency_overrides 的 ffmpeg_kit_flutter（android 用 third_party 自编 AAR）。
  ffmpeg_kit_flutter: ^6.0.3
  web_socket_channel: ^3.0.0
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
dev_dependencies:
  # BUG-3003: native hot-restart regression waits for worker IsolateExit events.
  vm_service: ^15.1.0
  build_runner: ^2.3.3
  plugin_platform_interface: ^2.1.0
  # BUG-2499: local_update_notifier_test 直接驱动 Windows toast 的 image XML
  # 序列化，守卫 ci/patches/hosted/flutter_local_notifications_windows-2.0.1
  # 的补丁真的打上了（file 路径不得百分号编码）。flutter_local_notifications
  # 的传递依赖，声明只为测试 import。
  flutter_local_notifications_windows: ^2.0.1
  drift_dev: ^2.23.0
  dependency_validator: ^3.0.0
  flutter_lints: ^2.0.1
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # my-comic：TMDB（视频）、Anki、浏览器查词扩展、网页视频播放器素材已移除。
    - assets/gamepad/xbox/
    - assets/gamepad/playstation/
    - assets/gamepad/switch/
    - assets/fonts/
    - assets/licenses/
    - assets/meta/
    # my-comic：词典弹窗（popup）与变形表（transforms）素材已移除。

  # M3E 语义图标（lib/src/utils/fushi_icons.dart）：Material Symbols Rounded 可变字体
  # 的子集，由 tool/icons/gen_fushi_symbols.py 生成。线框 / 实心各一个字族——选中态在
  # 只能传 IconData 的 API 里也能表达。release 构建的图标树摇只留用到的码位。
  # 刻意不放进上面的 assets/fonts/（那个目录整体登记为普通 asset，供阅读器 WebView
  # 按 URL 取用，不会被树摇）。
  fonts:
    - family: FushiSymbols
      fonts:
        - asset: assets/icon_fonts/FushiSymbolsRounded.ttf
    - family: FushiSymbolsFilled
      fonts:
        - asset: assets/icon_fonts/FushiSymbolsRoundedFilled.ttf
