# Windows 平台门：my-comic 只维护 Windows 桌面端。
#
# 原来的 Build Android APK workflow 已随平台裁剪删除；这里保留并改造成
# Windows 的 analyze + 全量单测门（PR / 手动触发）。Windows golden 由
# golden-tests.yml 负责，debug/release 构建与安装包分别由
# build-multiplatform.yml 和 release-desktop.yml 负责。
name: Windows analyze and test

on:
  pull_request:
    branches: ['main', 'develop']
    # 路径清单 = 本 workflow 真正读到的输入。main app / workspace 包 / 原生桥 /
    # CI 补丁 / vendored 依赖 / 发布脚本与 workflow 守卫都覆盖。
    paths:
      - 'my_comic/**'
      - 'packages/**'
      - 'native/**'
      - 'ci/**'
      - 'third_party/**'
      - 'tool/**'
      - '.github/actions/**'
      - '.github/workflows/main.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
      # runner; restore it so a release-asset hiccup cannot fail the build.
      - uses: ./.github/actions/pdfium-hook-cache
        with:
          purpose: test
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      - name: Flutter pub get
        working-directory: my_comic
        run: flutter pub get --enforce-lockfile
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # strings.g.dart is gitignored; generate it deterministically before
      # analyze/test (ticket 06; the release/golden/debug-build workflows do
      # the same, and script/build_and_run.ps1 regenerates on every build).
      - name: Generate l10n
        working-directory: my_comic
        run: dart run slang
      - name: Run dart analyze
        working-directory: my_comic
        run: flutter analyze
      - name: Run package tests
        shell: bash
        run: |
          # 扫描面按磁盘枚举，不写死包清单。
          #   * vendored / fork / stub —— 上游产物，不归本仓测；
          #   * my_comic_torrent —— 测试要 dlopen 真 DLL，由 build-multiplatform.yml
          #     windows job 专门跑。
          skip="flutter_inappwebview_windows gamepads_windows my_comic_torrent"
          ran=0
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            case " $skip " in
              *" $name "*) echo "::notice title=Skipped package::$name（vendored 或有专用 job）"; continue;;
            esac
            if [ -d "$pkg/test" ]; then
              echo "::group::Testing $name"
              (cd "$pkg" && dart ../../my_comic/tool/flutter_test_failures.dart --output-dir=../../.codex-test/flutter-test/$name)
              echo "::endgroup::"
              ran=$((ran + 1))
            else
              echo "::warning title=No package tests::$name has no test/ dir — its code is only covered transitively by the main-app suite"
            fi
          done
          # 规模哨兵：枚举写错或 packages/ 布局变动会让循环一个包都不跑。
          if [ "$ran" -lt 3 ]; then
            echo "::error title=Package test enumeration collapsed::只跑了 $ran 个包的测试，实测应有 4 个。去修枚举逻辑，不要调低这个下界。"
            exit 1
          fi

  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: unit-tests (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - uses: ./.github/actions/pdfium-hook-cache
        with:
          purpose: test
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      - name: Flutter pub get
        working-directory: my_comic
        run: flutter pub get --enforce-lockfile
      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      - name: Generate l10n
        working-directory: my_comic
        run: dart run slang
      # Golden image tests are excluded here and run in golden-tests.yml on the
      # Windows reference platform.
      - name: Run unit tests (main app, file shard ${{ matrix.shard }}/4)
        working-directory: my_comic
        run: dart run tool/flutter_test_failures.dart --file-shard=${{ matrix.shard }}/4 --exclude-tags golden
