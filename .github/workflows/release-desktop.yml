name: Build Windows Release Artifacts

on:
  # TODO-1208: docs-only / repo-chore pushes should not fire the full Windows
  # release build. Scope the PUSH trigger to build-relevant paths. The `release`
  # and `workflow_dispatch` triggers stay UNfiltered so manual beta/formal
  # publishes always run. A version bump lives under fushi/** so it still
  # triggers; rolling debug seq = commit count, so skipping a seq on a docs-only
  # push is harmless.
  push:
    # develop pushes still publish the rolling Windows debug build; main pushes
    # and manual dispatch publish the selected channel. Same behavior as before
    # the Windows-only trim, minus the macOS/iOS jobs.
    branches: ['main', 'develop']
    # push 路径 = 本 workflow 真正读到的文件。
    paths:
      - 'fushi/**'
      - 'packages/**'
      # C ABI bridge 源码：只改 native/ 的 PR 以前触发不了任何构建，
      # 编译挂了要等下一个不相关改动才暴露。
      - 'native/**'
      - 'ci/**'
      - 'tool/check_release_policy.ps1'
      - 'tool/release_sequence.sh'
      - 'tool/publish_update_manifest.sh'
      - 'tool/merge_update_manifest.py'
      - 'tool/mihon/**'
      - 'tool/ffmpeg-min/**'
      - 'tool/sign_windows_release.ps1'
      - 'tool/simplysign_connect.ps1'
      - 'tool/engine_overlay.ps1'
      - 'third_party/**'
      - 'tools/build_magpie_slim.ps1'
      - 'tools/bundle_7za.ps1'
      - '.github/workflows/release-desktop.yml'
      - '.github/actions/provide-baked-secrets/**'
      - '.github/actions/native-artifact-store/**'
      - '.github/actions/native-store-names/**'
      - '.github/actions/pdfium-hook-cache/**'
      - '.github/actions/flutter-engine-overlay/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: debug, beta, or formal'
        required: true
        default: beta
        type: choice
        options:
          - debug
          - beta
          - formal
      tag_name:
        description: 'Optional release tag. Defaults to v<version>-debug.<seq>+<sha>, v<version>-beta.<seq>, or v<version>.'
        required: false
      release_name:
        description: 'Optional GitHub Release title.'
        required: false
      # build_only 出候选包给人测但什么都不发布；语义与更新器、清单发布一致。
      build_only:
        description: 'Build the channel artifacts but publish nothing: no GitHub Release, no update manifest. Artifacts stay downloadable from the run page. Use to hand a release candidate out for testing before committing to the publish.'
        required: false
        default: false
        type: boolean

concurrency:
  # One Windows publisher per tag/sha. cancel-in-progress must stay false so a
  # running publish is never interrupted.
  group: fushi-release-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.event.release.tag_name || github.event.inputs.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    # BUG-2817：`release` 事件只给应用 release（tag = v<数字>…）构建；模型 / 依赖资产
    # release（manga-panel-detector-onnx-v1、vendor-libmpv、voice-hook-helper…）被手动
    # 发布时不许整套构建、把安装包挂到它们身上。表达式没有正则，只能逐个列 v0..v9；
    # 守卫 fushi/test/build/release_event_app_tag_guard_test.dart 钉住每个 job 都带它。
    if: ${{ (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: write
      # native-artifact-store 按名字查 / 下载本仓历史 run 的产物。
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate unified release policy
        shell: pwsh
        run: ./tool/check_release_policy.ps1
      # 只缓存 pub、不缓存 SDK：理由与实测见 build-multiplatform.yml windows job 同处注释。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: false
          pub-cache: true
      # pdfium_dart's build hook downloads PDFium from GitHub on every fresh
      # runner; restore it so a release-asset hiccup cannot fail the build.
      - uses: ./.github/actions/pdfium-hook-cache
        with:
          purpose: windows
      # 合成器内 HDR 需要打过补丁的 flutter_windows.dll（ci/patches/flutter-engine/）。
      - uses: ./.github/actions/flutter-engine-overlay
      - name: Resolve desktop release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_BUILD_ONLY: ${{ github.event.inputs.build_only }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//;s/+.*//')
          RELEASE_SEQUENCE=$(bash tool/release_sequence.sh)
          if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
            echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME}"
          CHANNEL="${INPUT_CHANNEL:-}"
          TAG="${INPUT_TAG_NAME:-}"
          NAME="${INPUT_RELEASE_NAME:-}"
          # BUG-2088：正式版/测试版**真实更新公告**的来源。此前 BODY 只有一行模板，
          # 而 NOTES 就是它——实测 v2.1.1 的 latest-stable.json 里 notes 是
          # 「Manual formal release from bridge/auto-migrate-download @ 4d1c8f4.」，
          # 而 GitHub 上那份正文有 3613 字：**应用内更新弹窗给用户看的一直是占位符**。
          # 约定：公告写在 docs/release-notes/<语义版本>.md，正式/测试通道自动取用；
          # 手动发 GitHub Release 时优先用 Release 正文（那才是当场写的那份）。
          # debug 通道不取——滚动开发构建挂完整 changelog 会误导。
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          BODY=""
          PRERELEASE=true
          MAKE_LATEST=false
          PUBLISH_MANAGED_RELEASE=false
          # BUG-869: manifest-only publish flag decoupled from
          # PUBLISH_MANAGED_RELEASE (see release.yml) so the `release` event can
          # emit latest-stable.json without re-touching the manual Release.
          PUBLISH_MANIFEST=false
          MANIFEST_CHANNEL=""

          case "$EVENT" in
            push)
              CHANNEL=debug
              TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
              NAME="${NAME:-MyComic desktop debug ${VERSION} (${SHORT_SHA})}"
              BODY="Automated desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
              PUBLISH_MANAGED_RELEASE=true
              ;;
            workflow_dispatch)
              case "$CHANNEL" in
                debug)
                  TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                  NAME="${NAME:-MyComic desktop debug ${VERSION} (${SHORT_SHA})}"
                  BODY="Manual desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                  ;;
                beta)
                  TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                  NAME="${NAME:-MyComic ${VERSION} beta ${RELEASE_SEQUENCE}}"
                  BODY="Manual desktop beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                  if [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
                  ;;
                formal)
                  TAG="${TAG:-v${VERSION}}"
                  NAME="${NAME:-MyComic ${VERSION}}"
                  BODY="Manual desktop formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                  if [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
                  PRERELEASE=false
                  MAKE_LATEST=true
                  ;;
                *)
                  echo "::error title=Invalid release channel::Use debug, beta, or formal."
                  exit 1
                  ;;
              esac
              PUBLISH_MANAGED_RELEASE=true
              ;;
            release)
              CHANNEL=github-release
              # 手动发 GitHub Release：正文就是当场写的公告，优先用它；留空（先建空
              # Release 再补正文）时回落到仓库里的公告文件。
              BODY="${RELEASE_BODY:-}"
              if [ -z "$BODY" ] && [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
              TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
              # BUG-869: a manually-published NON-prerelease Release IS the formal
              # stable release → emit latest-stable.json (with releaseSequence) for
              # in-China stable clients. Manifest-only; never touches the Release.
              if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
                MANIFEST_CHANNEL=formal
                PUBLISH_MANIFEST=true
                PRERELEASE=false
              fi
              ;;
            *)
              echo "::error title=Unsupported event::$EVENT is not a desktop release event."
              exit 1
              ;;
          esac

          # BUG-869: push / workflow_dispatch unchanged — MANIFEST_CHANNEL follows
          # CHANNEL and manifest publishes whenever the managed release does.
          if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
          if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

          # build_only：出候选包给人测，但**什么都不发布**。与 release.yml 的同名
          # 开关成对，语义必须一致——两条 workflow 同 tag 共用一个 concurrency 组、
          # 产出的是同一个 release 的不同平台资产，一边发一边不发会造出「只有一半
          # 平台的正式版」，比两边都不发更糟。
          #
          # 本文件有四份独立的 channel 解析（每个 job 一份），四份都要摁；漏一份就是
          # 「那个平台照发」。守卫测试逐个 occurrence 校验，不是只看第一份。
          if [ "$INPUT_BUILD_ONLY" = "true" ]; then
            PUBLISH_MANAGED_RELEASE=false
            PUBLISH_MANIFEST=false
            echo "::notice title=Build-only run::Channel '$CHANNEL' artifacts will be built and uploaded to this workflow run, but no GitHub Release and no update manifest will be published."
          fi

          BUILD_VERSION_NAME="$VERSION"
          case "$CHANNEL" in
            debug)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
                echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
                exit 1
              fi
              ;;
            beta)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
                echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
                exit 1
              fi
              ;;
            formal)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "::error title=Invalid formal tag::Use v<version>."
                exit 1
              fi
              ;;
          esac
          # BUG-1836：版本名对**所有版本 tag** 派生，不再只认 debug tag。
          # 此前 beta 走的是 pubspec 的裸 `$VERSION`，于是 beta 包在任何来源里都
          # 自称 `2.2.1`——「运行中代码版本」这条证据在 beta 上退化成常量，
          # BUG-1786 的「判据恒为真」与 BUG-1836 的「手动救援判失败」在 beta 通道
          # 全都还活着。          # 仍保留正则守门：`release` 事件的 tag 未经格式校验（可能是
          # `debug-rolling` 这类），无条件 ${TAG#v} 会让 --build-name 拿到非版本串
          # 直接构建失败。
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z]+\.[0-9]+)?(\+[0-9A-Fa-f]{7,40})?$ ]]; then
            BUILD_VERSION_NAME="${TAG#v}"
            BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
          fi
          # BUG-1481: per product family; the bridge (`app.hibiki.reader`) keeps
          # the historical `debug-rolling`. Must match release.yml.
          ROLLING_DEBUG_TAG=fushi-debug-rolling
          if [ "$CHANNEL" = debug ]; then
            PUBLISH_TAG="$ROLLING_DEBUG_TAG"
            ROLLING_DEBUG=true
          else
            PUBLISH_TAG="$TAG"
            ROLLING_DEBUG=false
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "publish_tag=$PUBLISH_TAG"
            echo "rolling_debug=$ROLLING_DEBUG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
            echo "publish_manifest=$PUBLISH_MANIFEST"
            echo "manifest_channel=$MANIFEST_CHANNEL"
            echo "build_version_name=$BUILD_VERSION_NAME"
            echo "release_sequence=$RELEASE_SEQUENCE"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 烘进包里的密钥统一由 composite action 注入 —— 这批注入曾被逐字抄进 11 个
      # job，抄到最后 TMDB 有 3 个变体、两条发布 workflow 一处都没有，导致发出去
      # 的包里 TMDB 恒「未配置」而 CI 全绿（BUG-1588）。真相源只留一份。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}
      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        shell: bash
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh
      # strings.g.dart is gitignored; generate it deterministically before the
      # release build so the shipped binary never uses a stale locale set.
      - name: Generate l10n
        working-directory: fushi
        run: dart run slang
      - name: Resolve native artifact store names
        id: native_store
        uses: ./.github/actions/native-store-names
        with:
          platform: windows
      - name: Raise gen_snapshot stack reserve (BUG-1589)
        shell: pwsh
        run: |
          flutter precache --windows
          $editbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\HostX64\x64\editbin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $editbin) { throw 'editbin.exe not found in the VS 2022 toolchain' }
          $snapshots = Get-ChildItem "$env:FLUTTER_ROOT\bin\cache\artifacts\engine" -Recurse -Filter gen_snapshot.exe
          if (-not $snapshots) { throw 'gen_snapshot.exe not found under engine artifacts' }
          foreach ($snap in $snapshots) {
            & $editbin.FullName /STACK:134217728 $snap.FullName
            if ($LASTEXITCODE -ne 0) { throw "editbin failed on $($snap.FullName)" }
            Write-Host "Raised stack reserve to 128MB: $($snap.FullName)"
          }
      # BUG-1589：这一步在 develop 上固定红，而错误**看不见**——MSBuild 把自定义
      # 生成步骤的真实报错折叠成 `Target dart_build failed` + `MSB8066`，日志里
      # 只剩这两行。本机用 -v 跑同一条命令才拿到真正的 CMake/hook 报错。
      #
      # 注意验证构建（build-multiplatform.yml）跑的是 `--debug`，**不走 AOT**，
      # 所以它绿不代表这条 release 路径绿——「CI 全绿」从来没覆盖过发布构建。
      #
      # -v 的日志量（本机实测约 2500 行）远小于「红了但不知道为什么」的代价。
      - name: Build Windows release
        working-directory: fushi
        run: >-
          flutter build windows --release -v
          --build-name "${{ steps.channel.outputs.build_version_name }}"
          --build-number "${{ steps.channel.outputs.release_sequence }}"
          --dart-define="FUSHI_BUILD_VERSION=${{ steps.channel.outputs.build_version_name }}"
      # 失败时把 CMake 自己的日志捞出来：-v 打的是 flutter 侧，CMake 配置期的
      # 报错只在这两个文件里。artifact 而不是 echo，避免再被日志截断吃掉。
      - name: Upload Windows build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-build-logs
          path: |
            fushi/build/windows/x64/CMakeFiles/CMakeOutput.log
            fushi/build/windows/x64/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Restore pinned Mihon desktop runtime
        id: mihon_runtime_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.mihon }}
          path: ${{ runner.temp }}\mihon-runtime
      - name: Bundle pinned Mihon desktop runtime
        shell: pwsh
        run: |
          $built = "$env:RUNNER_TEMP\mihon-runtime"
          if ('${{ steps.mihon_runtime_store.outputs.hit }}' -ne 'true') {
            .\tool\mihon\build_desktop_runtime.ps1 `
              -OutputDirectory $built `
              -DownloadCache "$env:RUNNER_TEMP\fushi-mihon-downloads"
            if ($LASTEXITCODE -ne 0) { throw "Mihon desktop runtime build failed ($LASTEXITCODE)" }
          }
          $runtime = "fushi\build\windows\x64\runner\Release\mihon_bridge"
          if (Test-Path -LiteralPath $runtime) { Remove-Item -LiteralPath $runtime -Recurse -Force }
          Copy-Item -LiteralPath $built -Destination $runtime -Recurse
          .\tool\mihon\verify_desktop_runtime.ps1 -RuntimeDirectory $runtime
      - name: Save Mihon desktop runtime to native artifact store
        if: steps.mihon_runtime_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.mihon }}
          path: ${{ runner.temp }}\mihon-runtime
      # 持久库理由与名字契约见 build-multiplatform.yml windows job 同名步骤（名字逐字一致）。
      - name: Restore galgame helper archives
        id: galgame_helper_store
        uses: ./.github/actions/native-artifact-store
        with:
          mode: restore
          name: ${{ steps.native_store.outputs.galgame }}
          path: native\galgame_hook\dist
      - name: Build and bundle galgame helper archives
        shell: pwsh
        run: |
          # 这句断言是把「意外安全」变成「显式安全」，不是在修一个当前的漏红。
          # 准确的 pwsh 规则是：$LASTEXITCODE 只被 **native 命令** 写，cmdlet
          # （Join-Path / New-Item / Test-Path / Copy-Item）不会重置它。下面整段
          # 只有这一条 native 命令，所以块尾 GitHub 追加的 `exit $LASTEXITCODE`
          # 今天确实拿到的是 build_distribution.ps1 的退出码 —— 它是对的。
          # 但这份正确性完全依赖「后面没有第二条 native 命令」：任何人在下方插入
          # 一条 git / 7z / certutil，`-RunTests` 里双架构 22 个 ctest 的判决就会
          # 被静默顶掉。显式断言后这个隐性前提消失。
          if ('${{ steps.galgame_helper_store.outputs.hit }}' -ne 'true') {
            powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/build_distribution.ps1 -RunTests
            if ($LASTEXITCODE -ne 0) { throw "build_distribution.ps1 -RunTests failed ($LASTEXITCODE)" }
          }
          # BUG-1449：把 helper 作为**普通文件**直接装进 bundle 的 voice_hook\<arch>\，
          # 不再随包发 zip 让运行时解压。zip + 侧车 + 运行时安装那套是 helper 还走网络
          # 下载时的设计；随包之后它只剩一个后果——磁盘上多出一份需要与本体保持同步的
          # 解压副本，而「保持同步」正是 BUG-1448 断掉的地方。构建期解压使两者同源，
          # 漂移在结构上不再可能。完整性校验没有削弱，只是前移到这里（构建期 fail-closed）。
          # 解压/校验逻辑与 build-multiplatform.yml 共用同一个脚本：这两段曾是孪生副本，
          # 而「两份各自漂移」就是本次要根治的形态，不要再复制粘贴回来。
          powershell -NoProfile -ExecutionPolicy Bypass -File native/galgame_hook/tools/install_into_bundle.ps1 -BundleDirectory "$PWD\fushi\build\windows\x64\runner\Release"
          if ($LASTEXITCODE -ne 0) { throw "install_into_bundle.ps1 failed ($LASTEXITCODE)" }
      - name: Save galgame helper archives to native artifact store
        if: steps.galgame_helper_store.outputs.hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/native-artifact-store
        with:
          mode: save
          name: ${{ steps.native_store.outputs.galgame }}
          path: native\galgame_hook\dist
      - name: Bundle slim Magpie for offline upscaling install
        shell: pwsh
        run: |
          # BUG-1217：随主包发行精简版 Magpie，超分首次使用不再需要下载 10.79 MB。
          # 脚本自己先校验上游完整包的 SHA-256 再裁剪重打包——裁剪等于重新签名，
          # 源包若被掉包而不先验，我们的侧车就成了给污染产物背书的东西。
          # 只出 x64：ARM64 用户极少且能跑 x64 模拟，为它多背 4.7 MB 不划算，
          # 那条路继续走按需下载。
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_magpie_slim.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_magpie_slim.ps1 failed ($LASTEXITCODE)" }
          $sourceDir = Join-Path $PWD 'dist'
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release\magpie_bundle'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($file in @(
            'Magpie-hibiki-slim-x64.zip',
            'Magpie-hibiki-slim-x64.zip.sha256'
          )) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing bundled magpie asset: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
      - name: Bundle full 7-Zip for discovery and manga extraction
        shell: pwsh
        run: |
          # 发现页与漫画导入的 7z/rar 离线解压依赖随包 7z.exe + 7z.dll
          # （LGPL，官方 GitHub 镜像 + SHA-256 钉死，fail-closed）。
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/bundle_7za.ps1 `
            -BundleDirectory "$PWD\fushi\build\windows\x64\runner\Release" `
            -DownloadCache "$env:RUNNER_TEMP\fushi-7za-cache"
          if ($LASTEXITCODE -ne 0) { throw "bundle_7za.ps1 failed ($LASTEXITCODE)" }
      - name: Build and bundle fushi_cli
        shell: pwsh
        run: |
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            throw "Missing Windows release bundle directory: $targetDir"
          }
          $exe = Join-Path $targetDir 'fushi_cli.exe'
          dart compile exe packages/fushi_cli/bin/fushi_cli.dart -o $exe
          if ($LASTEXITCODE -ne 0) { throw "dart compile exe fushi_cli failed ($LASTEXITCODE)" }
          # 冒烟：能起、能出帮助。app 不在跑时 status 应返回 69（EX_UNAVAILABLE），不是崩溃。
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "fushi_cli --help failed ($LASTEXITCODE)" }
          & $exe status | Out-Null
          if ($LASTEXITCODE -ne 69) { throw "fushi_cli status expected exit 69 (not running), got $LASTEXITCODE" }
          # 预期内的 69 已核对完。Actions 的 pwsh 包装会在脚本末尾追加
          # `exit $LASTEXITCODE`，且以 `pwsh -command ". '{0}'"` 点源执行——点源脚本里
          # `exit 69` 让 pwsh 进程以 1 退出、不打任何报错，整步无声变红。显式成功收尾。
          exit 0
      # ffmpeg.exe and its MinGW runtime DLLs are vendored at
      # third_party/ffmpeg-min/windows/
      # (TODO-416). It used to be fetched from another workflow's build artifact,
      # which silently broke whenever that artifact expired (90 days) or that
      # workflow had not run on this branch, shipping a Windows bundle with NO
      # ffmpeg -> missing video covers/subtitles. Copying the committed binary
      # plus its runtime DLLs makes every release self-contained and removes the
      # cross-workflow supply dependency.
      - name: Install vendored ffmpeg-min runtime into Windows bundle
        shell: pwsh
        run: |
          $sourceDir = Join-Path $PWD 'third_party\ffmpeg-min\windows'
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            throw "Missing Windows release bundle directory: $targetDir"
          }
          # BUG-1420: ffprobe rides along with ffmpeg. resolveFfprobeExecutable()
          # (ffmpeg_backend.dart) has always looked for it next to the app exe,
          # but the recipe used to pass --disable-ffprobe so it never existed and
          # the lookup silently fell through to PATH. Two features degrade
          # silently without it on a machine with no system ffmpeg: embedded
          # subtitle fonts (subtitle_embedded_fonts.dart) and audio container
          # tags (desktop_audio_clipper.dart).
          # TODO-2701 ②: no MinGW runtime DLLs here. The recipe builds Windows with
          # `--extra-ldflags=-static --pkg-config-flags=--static`, so zlib/pthread
          # are folded into the exe; ffmpeg.exe/ffprobe.exe import only system DLLs
          # (kernel32/msvcrt/ws2_32/secur32/bcrypt). libwinpthread-1.dll and
          # zlib1.dll were leftovers from the pre-static, dynamically-linked MSYS2
          # generation and shipped ~194 KB of dead weight to every user.
          $runtimeFiles = @(
            'ffmpeg.exe',
            'ffprobe.exe'
          )
          foreach ($file in $runtimeFiles) {
            $source = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing vendored ffmpeg-min runtime file: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $targetDir $file) -Force
          }
          Get-Item -LiteralPath ($runtimeFiles | ForEach-Object { Join-Path $targetDir $_ }) |
            Select-Object FullName, Length
      # TODO-1242 (P0): fushi's C++ modules link the MSVC CRT dynamically (/MD)
      # and reference newer STL/EH symbols (VCRUNTIME140_1!__CxxFrameHandler4).
      # The installer did NOT ship the CRT, so machines whose system VC++
      # Redistributable is stale (stuck at 2019 14.24) lack those exports and
      # fushi.exe dies at launch with a faulting MSVCP140.dll / c0000005 access
      # violation. Standard Flutter Windows distribution practice: copy the CRT
      # DLLs next to the exe (app-directory DLL search precedes System32, needs
      # no elevation) so the payload is self-contained regardless of the target
      # machine's system redist. The DLLs land in the same Release dir that
      # fushi.iss packages via `Source: {#SourceDir}\*`, so they ride into the
      # installer automatically. Sourced from the VS2022 redist on windows-2022.
      - name: Bundle VC++ CRT runtime into Windows bundle
        shell: pwsh
        run: |
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            throw "Missing Windows release bundle directory: $targetDir"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere not found: $vswhere (cannot locate the VS redist CRT)"
          }
          $vsInstall = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "vswhere could not resolve a Visual Studio installation path"
          }
          # Redist layout: <VSInstall>\VC\Redist\MSVC\<version>\x64\Microsoft.VC<NNN>.CRT\*.dll
          # Both <version> and <NNN> vary per VS build -- glob them, never hardcode.
          $redistRoot = Join-Path $vsInstall 'VC\Redist\MSVC'
          if (-not (Test-Path -LiteralPath $redistRoot -PathType Container)) {
            throw "VS redist root not found: $redistRoot"
          }
          $crtDir = Get-ChildItem -LiteralPath $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Get-ChildItem -Path (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'msvcp140.dll') -PathType Leaf } |
            Select-Object -First 1
          if ($null -eq $crtDir) {
            throw "Could not find a Microsoft.VC*.CRT x64 folder with msvcp140.dll under $redistRoot"
          }
          Write-Host "Using VC++ CRT redist: $($crtDir.FullName)"
          # Required trio: msvcp140 (STL) + vcruntime140 + vcruntime140_1 (the
          # __CxxFrameHandler4 EH exports the stale 14.24 redist is missing).
          # Absence must fail loudly -- silently skipping would ship a still-
          # crashing installer for this P0.
          $requiredDlls = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $requiredDlls) {
            $src = Join-Path $crtDir.FullName $dll
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) {
              throw "Required VC++ CRT DLL missing from redist: $src"
            }
            Copy-Item -LiteralPath $src -Destination (Join-Path $targetDir $dll) -Force
          }
          # Optional companions the same redist ships when present.
          $optionalDlls = @('msvcp140_1.dll', 'msvcp140_2.dll', 'msvcp140_codecvt_ids.dll', 'concrt140.dll')
          foreach ($dll in $optionalDlls) {
            $src = Join-Path $crtDir.FullName $dll
            if (Test-Path -LiteralPath $src -PathType Leaf) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $targetDir $dll) -Force
            }
          }
          Get-ChildItem -LiteralPath $targetDir -Filter '*140*.dll' |
            Select-Object FullName, Length
      # The bundled ffmpeg -version check below is the hard gate: it proves the
      # exact binary we ship in the installer payload executes. The fuller
      # smoke-test.sh comparison additionally needs a *fixture* full ffmpeg to
      # author representative MP4/MKV inputs (the minimal bundled binary
      # deliberately lacks lavfi/muxers - see windows_vendored_ffmpeg_guard).
      # GitHub windows runners do not preinstall ffmpeg, so the fixture comes
      # from `choco install ffmpeg`, whose source community.chocolatey.org
      # intermittently returns 504 Gateway Timeout (runs +130/+132). That is an
      # external-service flake on a *reference* generator, not a defect in the
      # shipped artifact, yet it was failing the whole Desktop release workflow
      # and blocking the installer. Fix (mirrors the TODO-624 emulator
      # non-blocking precedent): retry the choco install a few times to absorb
      # transient 504s, and if the fixture still cannot be obtained, emit a loud
      # ::warning:: and skip only the comparison smoke (the bundled -version gate
      # already ran). External-platform limitation: re-evaluate once a more
      # reliable fixture ffmpeg source is vendored/cached (TODO-652).
      - name: Smoke test bundled ffmpeg in Windows bundle
        shell: pwsh
        run: |
          # NOTE: keep the FULL literal bundle paths below (no $releaseDir
          # indirection). release_workflow_diagnostics_guard_test asserts on
          # these literals to prove the release smokes the exact binaries copied
          # beside fushi.exe -- splitting them into a variable silently blinds
          # that guard.
          $target = Join-Path $PWD 'fushi\build\windows\x64\runner\Release\ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
            throw "Missing bundled ffmpeg executable: $target"
          }
          & $target -version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled ffmpeg failed -version with exit code $LASTEXITCODE"
          }
          # BUG-1420: ffprobe is a SEPARATE executable with its own consumers
          # (embedded subtitle fonts, audio container tags). A bundle that ships
          # a healthy ffmpeg but a missing/broken ffprobe degrades silently -
          # both consumers swallow the ProcessException by design - so gate it
          # here with the same -version check rather than trusting the copy step.
          $probeTarget = Join-Path $PWD 'fushi\build\windows\x64\runner\Release\ffprobe.exe'
          if (-not (Test-Path -LiteralPath $probeTarget -PathType Leaf)) {
            throw "Missing bundled ffprobe executable: $probeTarget"
          }
          & $probeTarget -version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled ffprobe failed -version with exit code $LASTEXITCODE"
          }
          $fixtureCommand = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($null -eq $fixtureCommand) {
            # External dependency: tolerate transient chocolatey 504s with a
            # bounded retry instead of failing on the first flake.
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Installing fixture ffmpeg from chocolatey (attempt $attempt/3)"
              choco install ffmpeg -y --no-progress
              $fixtureCommand = Get-Command ffmpeg -ErrorAction SilentlyContinue
              if ($null -ne $fixtureCommand) { break }
              if ($attempt -lt 3) {
                Write-Host "Fixture ffmpeg not available yet; retrying in 30s..."
                Start-Sleep -Seconds 30
              }
            }
          }
          if ($null -eq $fixtureCommand) {
            Write-Host "::warning title=Fixture ffmpeg unavailable::Could not obtain a full fixture ffmpeg (chocolatey likely flaking, e.g. 504). The bundled ffmpeg -version gate already passed; skipping the fixture comparison smoke test. This is an external-service flake on a reference generator, not a defect in the shipped binary (TODO-652)."
            exit 0
          }
          $fixtureFfmpeg = $fixtureCommand.Source
          & $fixtureFfmpeg -version
          if ($LASTEXITCODE -ne 0) {
            throw "Fixture ffmpeg failed -version with exit code $LASTEXITCODE"
          }
          $bash = (Get-Command bash -ErrorAction Stop).Source
          $env:FFMPEG_MIN = ($target -replace '\\', '/')
          $env:FIXTURE_FFMPEG = ($fixtureFfmpeg -replace '\\', '/')
          & $bash -c 'bash tool/ffmpeg-min/smoke-test.sh'
      # 打包前校验「app 起不来就靠它」的核心文件真在 bundle 里。
      # 本仓已删除词典 / Blu-ray / 视频原生库；只剩 Flutter runner 与 app 本体。
      - name: Verify Windows installer payload has the core runtime
        shell: pwsh
        run: |
          $targetDir = Join-Path $PWD 'fushi\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath $targetDir -PathType Container)) {
            throw "Missing Windows release bundle directory: $targetDir"
          }
          $required = @(
            'fushi.exe',
            'flutter_windows.dll'
          )
          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $targetDir $file) -PathType Leaf)) {
              $missing += $file
            }
          }
          if ($missing.Count -gt 0) {
            throw ("Windows installer payload is missing core runtime file(s): " +
              ($missing -join ', ') +
              ". Shipping this bundle would brick the app at startup " +
              "(Failed to load dynamic library / error 126). Bundle dir: $targetDir")
          }
          Write-Host "Core runtime present in payload: $($required -join ', ')"

      # 编译器够不够新是硬要求，不是「有就行」：安装器的 MD3 外观整套走 6.7 才有的
      # 指令（WizardStyle 自定义样式 / WizardBackColor / Wizard*ImageFileDynamicDark，
      # 见 fushi/windows/installer/fushi.iss）。fushi.iss 留了 ISPP 版本闸门，老编译器
      # 上会**静默**退回旧外观——CI 一旦悄悄降级出包，谁也不会从产物上看出来。
      #
      # 判据是**能力探测**，不是版本号：ISCC.exe 的版本资源是 0.0.0.0，命令行 banner
      # 也只印「Inno Setup 6 Command-Line Compiler」不带小版本（6.7.3 本机实测），
      # 没有可靠的版本读法。直接拿一个只用 6.7 指令的最小脚本编一次：编得过就够新。
      # 代码签名走 Certum 云端 HSM（SimplySign）。私钥按 CA/B Forum 规则留在硬件里、
      # 导不出 .pfx，所以这里不能用 signtool /f cert.pfx —— 早先那条
      # WINDOWS_CERT_BASE64 -> cert.pfx 的路径对这类证书永远走不通，
      # 表现是 signcheck 恒判 false、签名步骤被静默跳过、发出去的包其实没签名。
      # 现在的通路：装 SimplySign Desktop（注册 CSP/KSP）-> 用 TOTP seed 无人值守
      # 登录 -> signtool /sha1 通过命名管道让云端 HSM 完成签名运算。
      - name: Check signing availability
        id: signcheck
        shell: bash
        env:
          SEED: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          if [ -n "$SEED" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi
          if [ -z "$SEED" ]; then
            echo "::warning title=Windows installer unsigned::CERTUM_OTP_URI secret 未配置，本次产物不会被签名。"
          fi
      # MSI 有 274MB，每次重下既慢又给 Certum 添负担。按版本号缓存。
      - name: Cache SimplySign Desktop installer
        if: steps.signcheck.outputs.have == 'true'
        id: ssdcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\SimplySignDesktop.msi
          key: simplysign-desktop-9.4.4.92-64bit-en
      - name: Install SimplySign Desktop
        if: steps.signcheck.outputs.have == 'true'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\SimplySignDesktop.msi"
          # 上游文件应当是不可变的（URL 带版本号）。哈希对不上就停 —— 这是签名
          # 凭据链路，宁可发不出版本，也不能把来路不明的 CSP/KSP 装进签名环境。
          $expected = '8EC420FC27798B86078B7BD02FE7152097E1B3005BAB51820EACA8E57DF84DA3'
          if (-not (Test-Path -LiteralPath $msi)) {
            $url = 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.4.92/SimplySignDesktop-9.4.4.92-64-bit-en.msi'
            Write-Host "下载 SimplySign Desktop…"
            Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          }
          $actual = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "SimplySign MSI 哈希不符。expected=$expected actual=$actual"
          }
          Write-Host "MSI 哈希校验通过。"
          $p = Start-Process msiexec -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec 安装失败，退出码 $($p.ExitCode)" }
          Write-Host "SimplySign Desktop 安装完成。"
      - name: Connect SimplySign (unattended)
        if: steps.signcheck.outputs.have == 'true'
        shell: pwsh
        env:
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
        run: |
          & "$PWD\tool\simplysign_connect.ps1"
          if ($LASTEXITCODE -ne 0) { throw "SimplySign 登录失败，退出码 $LASTEXITCODE" }
      # 给 bundle 里的所有 exe/dll 签名，必须在 Inno 打包**之前** —— 打包之后再签
      # 只能签到外壳，里面的程序仍是未签名的。
      # 只签外壳时的实际缺口：fushi.exe、fushi_update_launcher.exe、voice_hook/ 下的
      # 注入器与 hook DLL、ffmpeg/ffprobe 全部无签名，杀软扫描已安装目录照样报毒；
      # galgame 注入器尤其容易被盯上，而它恰恰是最需要签名背书的那个。
      # -SkipValidlySigned：bundle 里混着微软的 VC++ CRT 运行库，重签会把微软签名
      # 换成我们的，那是倒退不是补齐。
      - name: Sign Windows bundle binaries
        if: steps.signcheck.outputs.have == 'true'
        shell: pwsh
        env:
          CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
        run: |
          & "$PWD\tool\sign_windows_release.ps1" `
            -Path "$PWD\fushi\build\windows\x64\runner\Release" `
            -Recurse -SkipValidlySigned `
            -Description 'MyComic'
          if ($LASTEXITCODE -ne 0) { throw "bundle 签名失败，退出码 $LASTEXITCODE" }
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          function Test-Md3Capable([string]$compiler) {
            if (-not (Test-Path -LiteralPath $compiler)) { return $false }
            $probeDir = Join-Path $env:RUNNER_TEMP 'iscc-md3-probe'
            New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
            $probe = Join-Path $probeDir 'probe.iss'
            @(
              '[Setup]',
              'AppName=Probe',
              'AppVersion=1.0',
              'DefaultDirName={localappdata}\Probe',
              "OutputDir=$probeDir",
              'OutputBaseFilename=probe',
              'WizardStyle=modern dynamic windows11 hidebevels',
              'WizardBackColorDynamicDark=#141218',
              '[Files]'
            ) | Set-Content -LiteralPath $probe -Encoding UTF8
            & $compiler $probe | Out-Null
            return ($LASTEXITCODE -eq 0)
          }
          if (-not (Test-Md3Capable $iscc)) {
            Write-Host "Installed ISCC cannot compile the MD3 directives; installing pinned Inno Setup 6.7.3"
            # 官方 release 资产，不走 choco：choco 的 innosetup 包版本经常滞后，
            # 而这里要的是一个确定的版本，不是「最新可用的那个」。
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
            # SHA-256 钉死、fail-closed（与本文件里 7za 的做法同规格）。这里下载的
            # 东西比 7za 严重一个量级 —— 它是**编译出用户要运行的那个 setup.exe 的
            # 工具**；源包被掉包而不先验，我们的安装器就成了给污染产物背书的东西。
            $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($actual -ne $expected) {
              throw ("Inno Setup 6.7.3 installer SHA-256 mismatch: expected $expected, got $actual. " +
                "Refusing to run an unverified compiler installer.")
            }
            & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installer failed with exit code $LASTEXITCODE" }
            if (-not (Test-Md3Capable $iscc)) {
              throw ("Inno Setup 6.7+ is required for the Material Design 3 installer chrome " +
                "and the freshly installed compiler at $iscc still rejects those directives. " +
                "Shipping with an older compiler would silently fall back to the pre-MD3 look " +
                "(fushi.iss keeps an ISPP version gate so it still compiles).")
            }
          }
          Write-Host "ISCC accepts the MD3 wizard directives"
          & "$iscc" "/DAppVersion=${{ steps.channel.outputs.build_version_name }}" `
            "/DSourceDir=$PWD\fushi\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\fushi\build\installer" `
            "fushi\windows\installer\fushi.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Sign Windows installer
        if: steps.signcheck.outputs.have == 'true'
        shell: pwsh
        env:
          CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
        run: |
          & "$PWD\tool\sign_windows_release.ps1" `
            -Path "$PWD\fushi\build\installer\mycomic-${{ steps.channel.outputs.build_version_name }}-windows-setup.exe" `
            -Description 'MyComic'
          if ($LASTEXITCODE -ne 0) { throw "签名失败，退出码 $LASTEXITCODE" }
      # 打包后回验：把刚签好的安装器真的装进 runner 的临时目录，检查**装出来的**
      # 每个 exe/dll 都带签名。
      # 「Sign Windows bundle binaries」验的是打包**前**的文件，证明不了 Inno 把它们
      # 原样收了进去 —— 只要 iss 的 Source 规则漏掉某个子目录、或哪一步在打包前又
      # 覆盖了文件，那一步照样全绿，而用户装出来的仍是无签名程序。这一步验的是
      # 用户实际拿到的东西，等价于把「更新装完是什么样」搬进 CI。
      - name: Verify installed payload is signed
        if: steps.signcheck.outputs.have == 'true'
        shell: pwsh
        env:
          CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
        run: |
          $thumb = if ($env:CERTUM_CERT_THUMBPRINT) { $env:CERTUM_CERT_THUMBPRINT } else { 'D717A3F6A12F50B75E9D04072A69B1BCB590AE14' }
          $setup = "$PWD\fushi\build\installer\mycomic-${{ steps.channel.outputs.build_version_name }}-windows-setup.exe"
          $dst   = "$env:RUNNER_TEMP\payload-verify"
          # 不能用 Start-Process -Wait：它等的是「该进程**及其所有子孙进程**」退出
          # （PowerShell 的文档行为）。fushi.iss 的 [Run] 段带 postinstall，静默安装下
          # Inno 照样执行它、拉起 fushi.exe；那是 GUI 进程，永远不会自己退出，
          # 于是 -Wait 永远返回不了。iss 里的 nowait 只约束 Inno 自己不等，
          # 管不住 PowerShell 等子孙。实测：这一步曾就地挂死 45 分钟没有任何输出。
          # 改为只等安装器本体，并给上限；超时视为失败而不是无声拖到 job 超时。
          # 逐段打点：上一版整步 45 分钟零输出，除了「卡住了」什么都推断不出来。
          Write-Host "[verify] 开始静默安装到 $dst"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SP-', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$dst"
          ) -PassThru
          if (-not $p.WaitForExit(600000)) {
            try { $p.Kill() } catch { }
            throw "静默安装 10 分钟未结束，已终止。"
          }
          if ($p.ExitCode -ne 0) { throw "静默安装失败，退出码 $($p.ExitCode)" }
          # 收掉被 postinstall 拉起来的 fushi.exe：留着它会占住刚装出来的文件，
          # 后续读签名和 runner 清理都可能被卡。
          Get-Process -Name 'fushi' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "[verify] 安装完成，耗时 $([math]::Round($sw.Elapsed.TotalSeconds,1))s"
          if (-not (Test-Path -LiteralPath "$dst\fushi.exe")) { throw "装出来的目录里没有 fushi.exe: $dst" }

          $files = Get-ChildItem -LiteralPath $dst -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            # unins*.exe 是 Inno 在**安装时**现生成的卸载器，我们签不到它。
            Where-Object { $_.Name -notlike 'unins*.exe' }

          Write-Host "[verify] 待校验 exe/dll $($files.Count) 个，开始逐个读签名…"
          $ours = 0; $others = 0; [string[]] $unsigned = @()
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -eq 'Valid' -and $s.SignerCertificate.Thumbprint -eq $thumb) { $ours++ }
            elseif ($s.Status -eq 'Valid' -and $s.SignerCertificate) { $others++ }
            else { $unsigned += $f.FullName.Substring($dst.Length + 1) }
          }
          Write-Host "装出的 exe/dll 共 $($files.Count) 个：本证书签名 $ours，他方签名 $others，未签名 $($unsigned.Count)"

          $main = Get-AuthenticodeSignature -LiteralPath "$dst\fushi.exe"
          Write-Host "fushi.exe -> $($main.Status) / $($main.SignatureType) / $($main.SignerCertificate.Subject)"
          if ($main.Status -ne 'Valid' -or $main.SignerCertificate.Thumbprint -ne $thumb) {
            throw "fushi.exe 未被本证书签名 —— 安装包外壳签了但里面没签，等于没补齐。"
          }
          if ($unsigned.Count -gt 0) {
            $unsigned | ForEach-Object { Write-Host "  未签名: $_" }
            throw "装出来的目录里还有 $($unsigned.Count) 个无签名 exe/dll。"
          }
          Write-Host "回验通过：安装后目录内无任何未签名 exe/dll。"
      # 登录会话留在 runner 上没有意义，且 GitHub 托管 runner 用完即毁；
      # 自托管 runner 上不断开则会把会话泄给下一个 job。
      - name: Disconnect SimplySign
        if: always() && steps.signcheck.outputs.have == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Filter 'SimplySignDesktop.exe' -Recurse -Depth 3 -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Start-Process $exe.FullName -ArgumentList '/close' -Wait -ErrorAction SilentlyContinue }
      - name: Prepare Windows installer release asset
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        run: |
          set -euo pipefail
          installer="fushi/build/installer/mycomic-${BUILD_VERSION_NAME}-windows-setup.exe"
          asset_name="$(basename "$installer")"
          if [ ! -f "$installer" ]; then
            echo "::error title=Windows installer missing::Expected $installer"
            exit 1
          fi
          if [ "$CHANNEL" = "debug" ]; then
            case "$asset_name" in
              *-debug.*-windows-setup.exe) ;;
              *)
                echo "::error title=Invalid debug Windows installer asset::Expected *-debug.*-windows-setup.exe, got $asset_name"
                exit 1
                ;;
            esac
          fi
          mkdir -p fushi/build/release-artifacts
          rm -f fushi/build/release-artifacts/mycomic-*-windows-setup.exe
          cp "$installer" "fushi/build/release-artifacts/$asset_name"
      # TODO-866: same fragility as the Android release workflow -- the prepared
      # Windows installer is otherwise only uploaded as a GitHub Release asset
      # (softprops steps below). When that publish intermittently 403s, the
      # installer is built successfully but has NO download path and dies with
      # the runner. Capture it as a workflow-run artifact so the build is always
      # downloadable from the run page, decoupled from Release publish. The
      # single non-blocking `publish` job downloads this artifact and does all
      # Release publishing, so Windows never waits on / is blocked by mac/iOS.
      - name: Upload Windows installer artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-artifacts-windows
          path: |
            fushi/build/release-artifacts/mycomic-*-windows-setup.exe
          if-no-files-found: ignore
          # 正式 / 测试版 dispatch 的 publish job 要等人工审批（环境 release-publish，待审批
          # job 最长挂 30 天）才下载这些 artifact：三个平台的保留期都要盖住审批窗口。
          retention-days: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == 'formal' || github.event.inputs.channel == 'beta')) && 30 || 14 }}

  publish:
    needs: [windows]
    # BUG-2817：always() 会无视上游 job 被跳过，这里必须自己再挡一次非应用 tag。
    # 审批门（2026-10-17）：正式 / 测试版 dispatch 走环境 `release-publish`（必需审批人
    # hajisensai），Windows 构建完后停在这里等「发版」批准；push / `release` 事件走无
    # 保护规则的 `release-auto`。build_only 什么都不发，整个 job 跳过、不弹审批。理由与
    # 流程见 docs/agent/build.md「正式版预构建与审批发布」。
    if: ${{ always() && github.event.inputs.build_only != 'true' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v0') || startsWith(github.event.release.tag_name, 'v1') || startsWith(github.event.release.tag_name, 'v2') || startsWith(github.event.release.tag_name, 'v3') || startsWith(github.event.release.tag_name, 'v4') || startsWith(github.event.release.tag_name, 'v5') || startsWith(github.event.release.tag_name, 'v6') || startsWith(github.event.release.tag_name, 'v7') || startsWith(github.event.release.tag_name, 'v8') || startsWith(github.event.release.tag_name, 'v9')) }}
    environment: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.channel == 'formal' || github.event.inputs.channel == 'beta')) && 'release-publish' || 'release-auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # publish_update_manifest.sh 推完正式版清单要 `gh workflow run` 唤醒 R2 镜像；
      # job 级 permissions 会把没列出的 scope 置 none，缺 actions: write 则 dispatch 403。
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate unified release policy
        shell: pwsh
        run: ./tool/check_release_policy.ps1
      - name: Resolve desktop release channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_BUILD_ONLY: ${{ github.event.inputs.build_only }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' fushi/pubspec.yaml | sed 's/version: *//;s/+.*//')
          RELEASE_SEQUENCE=$(bash tool/release_sequence.sh)
          if ! [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]] || [ "$RELEASE_SEQUENCE" -le 0 ]; then
            echo "::error title=Invalid release sequence::Expected positive git rev-list count, got $RELEASE_SEQUENCE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME}"
          CHANNEL="${INPUT_CHANNEL:-}"
          TAG="${INPUT_TAG_NAME:-}"
          NAME="${INPUT_RELEASE_NAME:-}"
          # BUG-2088：正式版/测试版**真实更新公告**的来源。此前 BODY 只有一行模板，
          # 而 NOTES 就是它——实测 v2.1.1 的 latest-stable.json 里 notes 是
          # 「Manual formal release from bridge/auto-migrate-download @ 4d1c8f4.」，
          # 而 GitHub 上那份正文有 3613 字：**应用内更新弹窗给用户看的一直是占位符**。
          # 约定：公告写在 docs/release-notes/<语义版本>.md，正式/测试通道自动取用；
          # 手动发 GitHub Release 时优先用 Release 正文（那才是当场写的那份）。
          # debug 通道不取——滚动开发构建挂完整 changelog 会误导。
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          BODY=""
          PRERELEASE=true
          MAKE_LATEST=false
          PUBLISH_MANAGED_RELEASE=false
          # BUG-869: manifest-only publish flag decoupled from
          # PUBLISH_MANAGED_RELEASE (see release.yml) so the `release` event can
          # emit latest-stable.json without re-touching the manual Release.
          PUBLISH_MANIFEST=false
          MANIFEST_CHANNEL=""

          case "$EVENT" in
            push)
              CHANNEL=debug
              TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
              NAME="${NAME:-MyComic desktop debug ${VERSION} (${SHORT_SHA})}"
              BODY="Automated desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Push releases are always prerelease and never Latest."
              PUBLISH_MANAGED_RELEASE=true
              ;;
            workflow_dispatch)
              case "$CHANNEL" in
                debug)
                  TAG="${TAG:-v${VERSION}-debug.${RELEASE_SEQUENCE}+${SHORT_SHA}}"
                  NAME="${NAME:-MyComic desktop debug ${VERSION} (${SHORT_SHA})}"
                  BODY="Manual desktop debug-channel build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Debug releases are prerelease and never Latest."
                  ;;
                beta)
                  TAG="${TAG:-v${VERSION}-beta.${RELEASE_SEQUENCE}}"
                  NAME="${NAME:-MyComic ${VERSION} beta ${RELEASE_SEQUENCE}}"
                  BODY="Manual desktop beta/test build from ${GITHUB_REF_NAME} @ ${SHORT_SHA}. Beta/test releases are prerelease and never Latest."
                  if [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
                  ;;
                formal)
                  TAG="${TAG:-v${VERSION}}"
                  NAME="${NAME:-MyComic ${VERSION}}"
                  BODY="Manual desktop formal release from ${GITHUB_REF_NAME} @ ${SHORT_SHA}."
                  if [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
                  PRERELEASE=false
                  MAKE_LATEST=true
                  ;;
                *)
                  echo "::error title=Invalid release channel::Use debug, beta, or formal."
                  exit 1
                  ;;
              esac
              PUBLISH_MANAGED_RELEASE=true
              ;;
            release)
              CHANNEL=github-release
              # 手动发 GitHub Release：正文就是当场写的公告，优先用它；留空（先建空
              # Release 再补正文）时回落到仓库里的公告文件。
              BODY="${RELEASE_BODY:-}"
              if [ -z "$BODY" ] && [ -f "$NOTES_FILE" ]; then BODY="$(cat "$NOTES_FILE")"; fi
              TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME}}"
              # BUG-869: a manually-published NON-prerelease Release IS the formal
              # stable release → emit latest-stable.json (with releaseSequence) for
              # in-China stable clients. Manifest-only; never touches the Release.
              if [ "${RELEASE_IS_PRERELEASE}" = "false" ]; then
                MANIFEST_CHANNEL=formal
                PUBLISH_MANIFEST=true
                PRERELEASE=false
              fi
              ;;
            *)
              echo "::error title=Unsupported event::$EVENT is not a desktop release event."
              exit 1
              ;;
          esac

          # BUG-869: push / workflow_dispatch unchanged — MANIFEST_CHANNEL follows
          # CHANNEL and manifest publishes whenever the managed release does.
          if [ -z "$MANIFEST_CHANNEL" ]; then MANIFEST_CHANNEL="$CHANNEL"; fi
          if [ "$PUBLISH_MANAGED_RELEASE" = true ]; then PUBLISH_MANIFEST=true; fi

          # build_only：出候选包给人测，但**什么都不发布**。与 release.yml 的同名
          # 开关成对，语义必须一致——两条 workflow 同 tag 共用一个 concurrency 组、
          # 产出的是同一个 release 的不同平台资产，一边发一边不发会造出「只有一半
          # 平台的正式版」，比两边都不发更糟。
          #
          # 本文件有四份独立的 channel 解析（每个 job 一份），四份都要摁；漏一份就是
          # 「那个平台照发」。守卫测试逐个 occurrence 校验，不是只看第一份。
          if [ "$INPUT_BUILD_ONLY" = "true" ]; then
            PUBLISH_MANAGED_RELEASE=false
            PUBLISH_MANIFEST=false
            echo "::notice title=Build-only run::Channel '$CHANNEL' artifacts will be built and uploaded to this workflow run, but no GitHub Release and no update manifest will be published."
          fi

          BUILD_VERSION_NAME="$VERSION"
          case "$CHANNEL" in
            debug)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-debug\.[0-9]+\+[0-9A-Fa-f]{7,40}$ ]]; then
                echo "::error title=Invalid debug tag::Use v<version>-debug.<sequence>+<short-sha>, not debug-<sha>."
                exit 1
              fi
              ;;
            beta)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*-beta\.[0-9]+$ ]]; then
                echo "::error title=Invalid beta tag::Use v<version>-beta.<sequence>."
                exit 1
              fi
              ;;
            formal)
              if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "::error title=Invalid formal tag::Use v<version>."
                exit 1
              fi
              ;;
          esac
          # BUG-1836：版本名对**所有版本 tag** 派生，不再只认 debug tag。
          # 此前 beta 走的是 pubspec 的裸 `$VERSION`，于是 beta 包在任何来源里都
          # 自称 `2.2.1`——「运行中代码版本」这条证据在 beta 上退化成常量，
          # BUG-1786 的「判据恒为真」与 BUG-1836 的「手动救援判失败」在 beta 通道
          # 全都还活着。          # 仍保留正则守门：`release` 事件的 tag 未经格式校验（可能是
          # `debug-rolling` 这类），无条件 ${TAG#v} 会让 --build-name 拿到非版本串
          # 直接构建失败。
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z]+\.[0-9]+)?(\+[0-9A-Fa-f]{7,40})?$ ]]; then
            BUILD_VERSION_NAME="${TAG#v}"
            BUILD_VERSION_NAME="${BUILD_VERSION_NAME%%+*}"
          fi
          # BUG-1481: per product family; the bridge (`app.hibiki.reader`) keeps
          # the historical `debug-rolling`. Must match release.yml.
          ROLLING_DEBUG_TAG=fushi-debug-rolling
          if [ "$CHANNEL" = debug ]; then
            PUBLISH_TAG="$ROLLING_DEBUG_TAG"
            ROLLING_DEBUG=true
          else
            PUBLISH_TAG="$TAG"
            ROLLING_DEBUG=false
          fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "publish_tag=$PUBLISH_TAG"
            echo "rolling_debug=$ROLLING_DEBUG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "publish_managed_release=$PUBLISH_MANAGED_RELEASE"
            echo "publish_manifest=$PUBLISH_MANIFEST"
            echo "manifest_channel=$MANIFEST_CHANNEL"
            echo "build_version_name=$BUILD_VERSION_NAME"
            echo "release_sequence=$RELEASE_SEQUENCE"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Pull in the Windows installer uploaded by the `windows` job.
      - name: Download Windows release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-artifacts-windows
          merge-multiple: true
          path: fushi/build/release-artifacts
      - name: Upload assets to GitHub Release event
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          files: |
            fushi/build/release-artifacts/mycomic-*-windows-setup.exe
      # Rolling debug assets are pruned to the newest KEEP_SEQS sequences so a
      # reused `debug-rolling` release does not accumulate one installer per
      # commit. Scoped to this workflow's own Windows installer assets.
      - name: Prune stale assets from rolling debug release
        if: steps.channel.outputs.publish_managed_release == 'true' && steps.channel.outputs.rolling_debug == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PUBLISH_TAG: ${{ steps.channel.outputs.publish_tag }}
          BUILD_VERSION_NAME: ${{ steps.channel.outputs.build_version_name }}
        run: |
          set -euo pipefail
          # Keep the most recent KEEP_SEQS debug sequences (current + prior 2) so a
          # client mid-download against a just-superseded seq is not 404'd.
          KEEP_SEQS=3
          if ! gh release view "$PUBLISH_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Rolling release $PUBLISH_TAG does not exist yet; nothing to prune."
            exit 0
          fi
          ASSET_NAMES=()
          while IFS= read -r line; do ASSET_NAMES+=("$line"); done < <(
            gh release view "$PUBLISH_TAG" --repo "$REPO" --json assets \
              --jq '.assets[].name' || true
          )
          if [ "${#ASSET_NAMES[@]}" -eq 0 ]; then
            echo "No assets on $PUBLISH_TAG; nothing to prune."
            exit 0
          fi
          # Only ever prune this workflow's own Windows installer assets.
          PLATFORM_ASSETS=()
          for name in "${ASSET_NAMES[@]}"; do
            case "$name" in
              *-windows-setup.exe) PLATFORM_ASSETS+=("$name") ;;
            esac
          done
          # Check length BEFORE re-expanding the (possibly empty) array: on macOS
          # bash 3.2 `("${empty[@]}")` under `set -u` is an unbound-variable error,
          # and no-asset-for-this-platform is exactly the lagging / first-publish
          # case this fix must handle gracefully. `${#arr[@]}` is safe on 3.2.
          if [ "${#PLATFORM_ASSETS[@]}" -eq 0 ]; then
            echo "No Windows assets on $PUBLISH_TAG; nothing to prune."
            exit 0
          fi
          ASSET_NAMES=("${PLATFORM_ASSETS[@]}")
          # Asset names embed the versionName token `-<base>-debug.<seq>-` (e.g.
          # fushi-0.11.1-debug.5633-3cf5905-windows-setup.exe). Parse the current
          # build's seq from BUILD_VERSION_NAME (0.11.1-debug.5633), extract every
          # asset's seq the same way, keep the top KEEP_SEQS distinct seqs (numeric
          # desc), and delete only assets whose seq is NOT in that set. Assets with
          # no parseable debug seq are treated as stale (superseded/legacy naming).
          seq_of() { printf '%s' "$1" | sed -n 's/.*-debug\.\([0-9]\+\).*/\1/p'; }
          CURRENT_SEQ="$(seq_of "$BUILD_VERSION_NAME")"
          {
            # Terminal-position `[ -n "$X" ] && echo` inside a pipefail
            # brace-group returns 1 when the last test is false (empty seq /
            # legacy tail asset), which pipefail propagates and set -e kills
            # silently. Use no-else `if` so a false test yields exit 0.
            if [ -n "$CURRENT_SEQ" ]; then echo "$CURRENT_SEQ"; fi
            for name in "${ASSET_NAMES[@]}"; do
              s="$(seq_of "$name")"
              if [ -n "$s" ]; then echo "$s"; fi
            done
          } | sort -rn -u > /tmp/all_seqs.txt
          KEEP_SEQ_LIST=()
          while IFS= read -r line; do KEEP_SEQ_LIST+=("$line"); done < <(head -n "$KEEP_SEQS" /tmp/all_seqs.txt)
          echo "Keeping debug seqs: ${KEEP_SEQ_LIST[*]:-<none>}"
          in_keep() {
            local target="$1"
            for k in "${KEEP_SEQ_LIST[@]}"; do
              [ "$k" = "$target" ] && return 0
            done
            return 1
          }
          STALE=()
          for name in "${ASSET_NAMES[@]}"; do
            [ -n "$name" ] || continue
            s="$(seq_of "$name")"
            if [ -z "$s" ] || ! in_keep "$s"; then
              STALE+=("$name")
            fi
          done
          if [ "${#STALE[@]}" -eq 0 ]; then
            echo "No stale assets on $PUBLISH_TAG (all within kept seqs)."
            exit 0
          fi
          for asset in "${STALE[@]}"; do
            [ -n "$asset" ] || continue
            echo "  deleting stale asset $asset from $PUBLISH_TAG"
            gh release delete-asset "$PUBLISH_TAG" "$asset" --repo "$REPO" --yes
          done
      - name: Publish desktop channel release
        if: steps.channel.outputs.publish_managed_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.channel.outputs.publish_tag }}
          # Rolling debug: target the DEFAULT branch, not github.sha. GitHub rejects a
          # GITHUB_TOKEN update of a release whose resolved target commit changes
          # .github/workflows/ relative to the default branch (REST docs, "Update a release";
          # the token cannot hold `workflows`). develop diverged from main in workflows from
          # 2026-09-29 21:13 on and the rolling publish failed intermittently with
          # "Resource not accessible by integration" (10 of 27 attempts; Android stuck ~3 h).
          # The rolling tag already exists, so target_commitish never moves it; the develop
          # sha stays in the release name/body. Beta/formal keep github.sha.
          target_commitish: ${{ steps.channel.outputs.rolling_debug == 'true' && github.event.repository.default_branch || github.sha }}
          name: ${{ steps.channel.outputs.name }}
          body: ${{ steps.channel.outputs.body }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          files: |
            fushi/build/release-artifacts/mycomic-*-windows-setup.exe
      # TODO-705: publish a mirror update manifest so beta/debug in-China update
      # checks succeed (raw.githubusercontent.com is proxiable; api.github.com
      # /releases is mirror-403'd, BUG-292). This pushes a DATA FILE to the
      # update-manifest branch -- it is NOT a GitHub Release: it never sets
      # make_latest / prerelease:false, reuses the channel outputs verbatim, uses
      # the shared release_sequence (never run_number), and update-manifest is
      # absent from this workflow's push trigger (main/develop only) so it does
      # not cascade a run. Merges this platform's assets into any same-tag
      # manifest the Android workflow already pushed (concurrent, dedupe by name).
      - name: Publish mirror update manifest (Windows assets)
        # BUG-869: gate on publish_manifest + manifest_channel so the `release`
        # event emits latest-stable.json without re-touching the manual Release.
        if: steps.channel.outputs.publish_manifest == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.channel.outputs.manifest_channel }}
          TAG: ${{ steps.channel.outputs.tag }}
          # TODO-1049: manifest `tag` keeps the versioned/seq TAG for client
          # version comparison; asset URLs resolve under DOWNLOAD_TAG (the actual
          # release tag -- `debug-rolling` for debug, else identical to TAG).
          DOWNLOAD_TAG: ${{ steps.channel.outputs.publish_tag }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          NOTES: ${{ steps.channel.outputs.body }}
          VERSION: ${{ steps.channel.outputs.build_version_name }}
          RELEASE_SEQUENCE: ${{ steps.channel.outputs.release_sequence }}
          ARTIFACTS_DIR: fushi/build/release-artifacts
          ASSET_GLOB: mycomic-*-windows-setup.exe
          PLATFORM_LABEL: windows
        run: bash tool/publish_update_manifest.sh
