name: Bug report / 问题反馈
description: Something doesn't work as expected. / 功能异常、报错、闪退等。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/Myyuluo/my-comic/issues?q=is%3Aissue) first to avoid duplicates. English or Chinese are both fine.
        感谢反馈！提交前请先搜索[已有 issue](https://github.com/Myyuluo/my-comic/issues?q=is%3Aissue) 避免重复。中英文均可。
  - type: input
    id: version
    attributes:
      label: App version / 版本号
      description: Shown in Settings. / 可在设置中查看。
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: OS version / 系统版本
      placeholder: e.g. Windows 11 24H2
  - type: dropdown
    id: area
    attributes:
      label: Area / 功能模块
      multiple: true
      options:
        - Library & tags / 书架与标签
        - Manga detail / 作品页
        - Reader / 阅读器
        - Online sources & extensions / 在线源与扩展
        - Download / 下载
        - History / 历史
        - Local source / 本地源
        - Backup import & export / 备份导入导出
        - Settings & UI / 设置与界面
        - Other / 其他
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: What did you expect, and what happened instead? / 期望的结果与实际结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often? / 出现频率
      options:
        - Every time / 每次必现
        - Sometimes / 偶尔
        - Only once / 仅出现过一次
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: |
        Settings → Diagnostics → Error Log (or enable Debug Log, reproduce, then open it) → copy and paste here, or tap "Upload to server" and mention that you did. Remove anything private.
        设置 → 诊断 → 错误日志（或先打开「启用调试日志」、复现后再查看调试日志）→ 复制粘贴到这里，或点「上传到服务器」并在此注明已上传。请删去隐私内容。
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots / recordings / sample files · 截图、录屏、样本文件
      description: Drag files here. A minimal sample file helps a lot for reader/import issues. / 直接拖入文件；阅读器、导入类问题附最小样本文件最有帮助。
